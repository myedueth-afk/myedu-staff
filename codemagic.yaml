workflows:
  ios-release:
    name: Staff iOS Release IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter get
        script: flutter pub get
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y MyEdu-Staff.ipa Payload
    artifacts:
      - MyEdu-Staff.ipa
